<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10294f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>תנ״ך יומי</title>
<style>
@font-face{font-family:"TanachFont";src:url(font.woff2) format("woff2");font-weight:100 900;font-stretch:62% 100%;font-display:swap}
@font-face{font-family:"UIFont";src:url(font-ui.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#f4efe4;--card:#fffdf8;--ink:#23262d;--mute:#6d6a62;--accent:#14305a;--ok:#22875a;--line:#e6dec9;--mark:#fff1b8;--fs:26px;
 --hld:#fde2a0;--hlz:#c6ecd6;--bmc:#9b2c3d;--bmbg:rgba(155,44,61,.10);--bmflash:rgba(155,44,61,.32);--c1:#b4572b;--c2:#1b7f8c;--c3:#6a3fa0;--gold:#d9a441;--hero1:#0f2750;--hero2:#1b5e86;--hero3:#1b8a94}
[data-theme=dark]{--bmc:#e57a8e;--bmbg:rgba(229,122,142,.14);--bmflash:rgba(229,122,142,.38);--bg:#12161c;--card:#1b2029;--ink:#e9e5da;--mute:#9b978c;--accent:#9cc0f0;--ok:#5fc287;--line:#2b323d;--mark:#4a4220;--hld:#5a4a1a;--hlz:#1f5a3d;--c1:#e08a5c;--c2:#52b8c4;--c3:#b394e6}
[data-theme=sepia]{--bmc:#8a2c1d;--bmbg:rgba(138,44,29,.12);--bmflash:rgba(138,44,29,.34);--bg:#efe2c3;--card:#f8edd3;--ink:#3b2f1a;--mute:#7a6a4a;--accent:#6b3f1d;--ok:#3d7a43;--line:#d8c79d;--mark:#f3d982;--hld:#f4cf7a;--hlz:#bfe0c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"UIFont",system-ui,"Segoe UI",Arial,sans-serif;font-size:17px}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
svg{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:720px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom))}
/* hero */
.hero{margin:0 -14px;padding:calc(14px + env(safe-area-inset-top)) 18px 48px;text-align:center;color:#fff;border-radius:0 0 34px 34px;
 background:radial-gradient(circle at 15% 10%,rgba(217,164,65,.35),transparent 45%),radial-gradient(circle at 90% 90%,rgba(255,255,255,.12),transparent 40%),linear-gradient(160deg,var(--hero1),var(--hero2) 60%,var(--hero3))}
.logo{display:inline-block;background:#fff;border-radius:18px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.logo img{display:block;height:72px;width:auto}
.hero h1{margin:8px 0 0;font-size:31px;font-weight:800;letter-spacing:.5px}
.hero h1 b{color:var(--gold)}
.hero p{margin:0;opacity:.9;font-size:14px}
.htop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hded{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 14px;border:1px solid rgba(217,164,65,.55);border-radius:14px;background:rgba(255,255,255,.08);text-align:center}
.hded div{line-height:1.25}
.hded i{width:26px;height:1px;background:var(--gold);opacity:.8}
.hded small{display:block;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.6px}
.hded b{display:block;font-size:15px;font-weight:700;color:#fff}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);margin:6px auto 0;max-width:260px}
.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn:after{transform:scaleX(-1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(20,48,90,.06)}
.datecard{margin-top:-34px;text-align:center;position:relative;padding:12px 12px 12px}
.datecard .he{font-size:26px;font-weight:800;color:var(--accent);line-height:1.2}
.datecard .gr{font-size:15px;color:var(--mute);margin-top:2px}
.chip{display:inline-block;margin-top:6px;background:linear-gradient(90deg,var(--c2),var(--c3));color:#fff;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:600}
.strip{display:flex;gap:5px;margin-top:8px}
.dy{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:4px 0 5px;font-size:12px;color:var(--mute);line-height:1.15;font-weight:600}
.dy b{display:block;font-size:15px;color:var(--ink);margin-top:2px;font-weight:800}
.dy.sel{background:var(--accent);border-color:var(--accent);color:#cfe0f5}.dy.sel b{color:#fff}
.dy.today{box-shadow:inset 0 -4px 0 var(--gold)}
.dy:disabled{opacity:.35;cursor:default}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.weeknav button{border:0;background:none;color:var(--accent);font-weight:800;font-size:15px;padding:8px 4px}
.weeknav .td{border:2px solid var(--accent);border-radius:999px;padding:4px 20px;background:none;color:var(--accent)}
.weeknav .td.on{background:var(--accent);color:var(--card);box-shadow:0 3px 10px rgba(20,48,90,.3)}
.swrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:13px;color:var(--mute);font-weight:600}
.sg{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--ink)}
.sg.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.nav{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 18px;font-weight:600}
.nav button.p{background:var(--accent);color:var(--card);border-color:var(--accent)}
/* chapter cards */
.chap{display:flex;align-items:center;gap:10px;padding:10px 20px 10px 12px;position:relative;overflow:hidden}
.chap:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:9px;background:linear-gradient(180deg,var(--hero1),var(--hero2) 60%,var(--hero3))}
.chap .t{flex:1}
.chap .t small{color:var(--cc);font-weight:700;font-size:14px}
.chap .t b{font-size:23px;display:block;line-height:1.15}
.chap .t span{font-size:14px;color:var(--mute)}
.chap .btns{display:flex;flex-direction:column;gap:6px}
.btn{border:0;border-radius:12px;padding:7px 14px;font-weight:700;white-space:nowrap}
.btn.read{background:linear-gradient(135deg,var(--hero1),var(--hero2) 65%,var(--hero3));color:#fff;font-size:17px;font-weight:800;padding:6px 16px 6px 10px;display:flex;align-items:center;gap:9px;box-shadow:0 5px 14px rgba(16,41,80,.35)}
.btn.read .ic{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.btn.read .ic svg{width:20px;height:20px;stroke-width:2.2}
.btn.read:active{transform:scale(.97)}
.btn.chk{background:var(--bg);border:2px solid var(--line);color:var(--mute)}
.btn.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chap.done .t b{color:var(--ok)}
.banner{background:var(--mark);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin:14px 0}
.banner.col{flex-direction:column;align-items:stretch}
.banner .bb{display:flex;gap:8px;flex-wrap:wrap}
.banner .bb button{margin:0;flex:1;min-width:130px}
.banner button{margin-inline-start:auto;border:0;background:var(--accent);color:var(--card);border-radius:10px;padding:9px 14px;font-weight:700;white-space:nowrap}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{width:56px;height:56px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:16px}
.prog{display:flex;align-items:center;gap:14px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
h3.sh{margin:0 0 10px;font-size:19px;color:var(--accent);display:flex;align-items:center;gap:8px}
.lbl{font-size:13px;font-weight:700;color:var(--mute);margin:10px 2px 4px}
.sels{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;gap:8px}
select{width:100%;height:46px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 10px;font-size:17px;color:var(--ink)}
.sels2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.tabs button{flex:1;border:0;border-radius:14px;background:none;padding:8px 4px;font-size:14px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--accent);font-weight:800}
.tabs button.hl{background:linear-gradient(135deg,#1b5e86,#1b8a94);color:#fff;font-weight:800;box-shadow:0 5px 14px rgba(27,94,134,.5);position:relative}
.tabs button.hl i{position:absolute;top:-9px;left:10px;background:var(--gold);color:#14305a;border-radius:999px;font-style:normal;font-size:12px;font-weight:800;padding:1px 8px}
.sec{font-size:15px;font-weight:800;margin:20px 4px 4px;display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:6px;height:18px;border-radius:3px;background:var(--cc)}
.book{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0}
.book .r{display:flex;justify-content:space-between;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.grid button{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px}
.grid button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.grid button.bm{outline:3px solid var(--gold)}
/* footer */
.ft{text-align:center;margin:30px 0 8px;color:var(--mute)}
.ft .ded{margin:10px auto;padding:12px 10px;max-width:380px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ft .ded small{display:block;color:var(--gold);letter-spacing:1px;font-size:13px;font-weight:700}
.ft .ded b{display:block;color:var(--accent);font-size:17px;font-weight:700;margin:1px 0 6px}
.ft .ded b:last-child{margin-bottom:0}
.ft .cp{font-size:12px;opacity:.85}
.ft .src{font-size:11px;opacity:.75;margin-top:6px;line-height:1.5}
.ft .src a{color:inherit;text-decoration:underline}
/* reader */
.rh{position:sticky;top:0;z-index:5;margin:0 -14px;padding:calc(8px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;color:#fff;background:linear-gradient(160deg,var(--hero1),var(--hero2) 70%,var(--hero3));box-shadow:0 4px 14px rgba(0,0,0,.2)}
.rh .home{display:flex;align-items:center;gap:6px;border:0;background:#fff;color:#10294f;font-weight:800;border-radius:999px;padding:9px 14px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
.rh .rt{flex:1;text-align:center;font-weight:800;font-size:19px}
.rh .gear{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;height:42px;min-width:46px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
.cmn{font-size:14px;color:var(--mute);text-align:center;margin:6px 0;font-family:"UIFont",system-ui,sans-serif}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:12px 0 4px;font-family:"UIFont",sans-serif}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block}
.text{font-family:"TanachFont","Noto Serif Hebrew","Ezra SIL","SBL Hebrew","Times New Roman",serif;font-size:var(--fs);line-height:2.2;text-align:right;hyphens:none;margin-top:8px}
.v{border-radius:8px;transition:background .3s}
.v.bm{background:var(--bmbg)}
.v.pulse{animation:bmpulse .9s ease-in-out 3}
@keyframes bmpulse{0%,100%{background:var(--bmbg)}50%{background:var(--bmflash)}}
.vn.on{background:var(--bmc);border-color:var(--bmc);color:#fff}
.vn svg{width:1.1em;height:1.1em;vertical-align:-.18em;margin-inline-start:5px}
.vn.on svg{fill:currentColor}
.bmline{display:flex;align-items:center;gap:10px;margin:8px 0 14px;color:var(--bmc);font-family:"UIFont",system-ui,sans-serif;font-size:16px;font-weight:800;line-height:1.2}
.bmline:before,.bmline:after{content:"";flex:1;height:2px;background:var(--bmc);opacity:.85}
.bmline button{border:1px solid var(--bmc);background:transparent;color:var(--bmc);border-radius:999px;font-size:12px;font-weight:700;padding:3px 10px}
.hint{display:flex;align-items:center;gap:12px;background:var(--card);border:2px dashed var(--bmc);border-radius:16px;padding:12px 14px;margin:10px 0 4px;font-family:"UIFont",system-ui,sans-serif;font-size:15px;line-height:1.5}
.hint b{color:var(--bmc)}
.hint button{border:0;background:var(--bmc);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;white-space:nowrap}
.bmcard{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--card),var(--bmbg));border:2px solid var(--bmc);padding:14px}
.bmcard .ico{width:46px;height:46px;border-radius:50%;background:var(--bmc);color:#fff;display:grid;place-items:center;flex:none}
.bmcard .ico svg{width:24px;height:24px;fill:currentColor}
.bmcard .tx{flex:1;min-width:0}
.bmcard .tx small{color:var(--bmc);font-weight:800;font-size:13px}
.bmcard .tx b{display:block;font-size:20px}
.bmcard .tx span{display:block;font-family:"TanachFont",serif;font-size:17px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.rls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 2px;font-size:14px;color:var(--mute);font-weight:700}
.chap .rls{margin:8px 0 0}
.rl{max-width:100%;text-decoration:none;border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px;line-height:1.2;display:inline-block}
.rl.sp{background:#1db954;color:#07210f}.rl.ez{background:var(--accent);color:var(--card)}
.nv{flex:none;width:44px;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:14px;display:grid;place-items:center;padding:0}
.nv:disabled{opacity:.28;cursor:default}
.nv svg{width:22px;height:22px;stroke-width:2.6;margin:0}
.tabs .nv{align-self:center}
.rh{flex-wrap:wrap}
.rh .nv{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;width:42px;min-height:42px}
.rh .spacer{flex:1}
.rh .rt2{flex-basis:100%;text-align:center;font-weight:800;font-size:19px;margin-top:2px}
.bookrow{display:flex;gap:6px;align-items:stretch;margin:6px 0}
.bookrow .book{margin:0;flex:1}
.bk-all{flex:none;width:54px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:800;font-size:20px;color:var(--ok)}
.bk-all.full{background:var(--ok);color:#fff;border-color:var(--ok)}
.bkhead{font-weight:800;font-size:17px;margin-bottom:10px}
.bkbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bkbtns button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.bkbtns button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.bkbtns button.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
.grid button.sel{outline:3px solid var(--accent);background:var(--mark)}
.selbar{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.selbar b{flex-basis:100%;font-size:15px}
.selbar button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px}
.selbar button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ver{font-size:12px;color:var(--mute);margin-top:12px;font-weight:700}
.refbtn{display:block;margin:8px auto 0;border:2px solid var(--accent);background:var(--card);color:var(--accent);border-radius:12px;padding:10px 18px;font-weight:800;font-size:15px}
.vernote{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.4}
.sharecard{border:2px solid var(--line);padding:13px;margin:10px 0}
.sharecard .shh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--ink);margin:0 0 4px}
.sharecard .shh svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sharecard .shs{font-size:13px;color:var(--mute);margin:0 0 10px}
.sharecard .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sharecard .sb{display:flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:999px;padding:10px 10px;color:#fff;font-weight:800;font-size:16px;transition:transform .12s}
.sharecard .sb:active{transform:scale(.96)}
.sharecard .sb svg{width:22px;height:22px;fill:currentColor;flex:none}
.sharecard .sb.cp svg{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sharecard .wa{background:#2f9e44}.sharecard .fb{background:#1877d2}.sharecard .tg{background:#12a0a8}.sharecard .cp{background:#5b2fa3}
.sharecard .more{margin-top:8px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:999px;padding:9px;font-weight:800;font-size:16px}
.sharecard .more svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sharecard .help{display:block;margin:8px auto 0;border:0;background:none;color:var(--mute);text-decoration:underline;font-size:13px;padding:0}
.help-steps{font-size:16px;line-height:1.7}.help-steps li{margin-bottom:8px}.help-steps b{color:var(--accent)}
.bmcard{flex-wrap:wrap}
.bmcard .go{border:0;background:var(--bmc);color:#fff;border-radius:12px;padding:13px 14px;font-weight:800;font-size:17px;width:100%}
.vn{font-family:"UIFont",system-ui,sans-serif;font-size:.5em;line-height:1.1;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-inline-end:6px;cursor:pointer;vertical-align:middle;background:var(--card);white-space:nowrap;min-width:34px}
.vn:focus-visible,.hl:focus-visible,.lo:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pb{display:block;height:.6em}
.hl{border-radius:10px;padding:1px 4px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.d{background:var(--hld)}.hl.z{background:var(--hlz)}.hl.dz{background:linear-gradient(180deg,var(--hld) 50%,var(--hlz) 50%)}
.lo{border:0;line-height:1.6;display:inline-block;font-family:"UIFont",sans-serif;font-size:.45em;border-radius:999px;padding:0 9px;margin-inline-end:4px;vertical-align:middle;cursor:pointer;color:var(--ink)}
.lo.d{background:var(--hld)}.lo.z{background:var(--hlz)}
.rbar{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:stretch;z-index:6;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.rbar button{border:1px solid var(--line);background:var(--bg);border-radius:14px;min-height:50px;padding:4px 10px;font-weight:700;line-height:1.15;flex:1}
.rbar button small{display:block;font-weight:500;font-size:12px;color:var(--mute)}

  if (S.cd || S.cz) loadComm(bi);
  loadText(bi);
  if (!TX[bi]) {
    return `<header class="rh"><button class="home" data-home>${I.home}<span>דף הבית</span></button>${navArrows()}<span class="spacer"></span><div class="rt2">${chName(g)}</div></header>` +
      (txFail[bi] ? `<div class="card" style="text-align:center;margin-top:24px"><div style="font-size:18px;font-weight:700">לא הצלחנו לטעון את הטקסט</div><div style="color:var(--mute);margin:6px 0 12px">בדוק את החיבור לאינטרנט ונסה שוב.</div><button class="btn read" style="margin:auto" data-retry>נסה שוב</button></div>` : `<div class="cmn" style="margin-top:40px;font-size:18px">טוען את הפרק…</div>`) + footer(true);
  }
  const vs = TX[bi][CH[g].c];
  let j = null;
  if (S.cd || S.cz) { loadComm(bi); j = commCache[bi] || null; }
  POP = [];
  let t = ""; vs.forEach((v, i) => {
    const pb = v.endsWith("\n");
    if (markV(g) === i) t += bmAt(g, i) ? `<div class="bmline" id="bmline"><span>🔖 עד כאן למדתי</span><button data-bmclear>הסר</button></div>` : `<div class="bmline" id="bmline"><span>🔖 כאן עצרת בפעם הקודמת</span></div>`;
    t += `<span class="v ${markV(g) === i ? "bm" : ""} ${route.pulseV === i && Date.now() < route.pulseUntil ? "pulse" : ""}" id="v${i}"><button class="vn ${bmAt(g, i) ? "on" : ""}" data-bm="${i}" aria-pressed="${bmAt(g, i)}" aria-label="סימניה: עד כאן למדתי, לפני פסוק ${gem(i + 1)}">${gem(i + 1)}${BMI}</button>${verseHTML(v, i, g, j)}</span>${pb ? '<span class="pb"></span>' : ""}`;
  });
  const done = isDone(g), nx = g + 1 < TOTAL ? chName(g + 1) : "", pv = g > 0 ? chName(g - 1) : "";
  const legend = ((S.cd || S.cz) ? `<div class="legend">${S.cd ? '<span><i style="background:var(--hld)"></i>מצודת דוד</span>' : ""}${S.cz ? '<span><i style="background:var(--hlz)"></i>מצודת ציון</span>' : ""}<span>· לחצו על מילה מסומנת לפירוש</span></div>` : "")
    + `<div class="legend"><span style="color:var(--bmc);font-weight:700">${BMI.replace("<svg", '<svg style="width:15px;height:15px;stroke:currentColor;fill:none"')} עצרתם? לחצו על מספר הפסוק הבא (שעוד לא קראתם) לסימון עד היכן למדתם</span></div>`;
  const hint = !S.hintBm && !S.bm ? `<div class="hint"><div>💡 <b>עצרתם?</b> לחצו על מספר <b>הפסוק הבא</b> שעוד לא קראתם (עם סימן הסימניה). הקו יסמן עד היכן למדתם, ובפעם הבאה תמשיכו בדיוק משם.</div><button data-hint>הבנתי</button></div>` : "";
  
  return `<header class="rh"><button class="home" data-home>${I.home}<span>דף הבית</span></button>${navArrows()}<span class="spacer"></span><button class="gear" data-set aria-label="הגדרות תצוגה">Aa</button><div class="rt2">${chName(g)}</div></header>
  ${resLinks(g)}${legend}${hint}<div class="text" style="--fs:${S.fs}px">${t}</div>${footer(true)}
  <div class="rbar"><button data-prev ${g === 0 ? "disabled" : ""}>› הפרק הקודם<small>${pv}</small></button><button class="learn ${done ? "on" : ""}" data-toggle="${g}">${done ? "✓ למדתי" : "סמן כנלמד"}</button><button class="next" data-next ${g + 1 >= TOTAL ? "disabled" : ""}>הפרק הבא ‹<small>${nx}</small></button></div>`;
}
let lastBm = null;
function pulseVerse(v, el) { route.pulseV = v; route.pulseUntil = Date.now() + 2800; el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
function render() {
  if (route.v !== "book") { selMode = false; SEL.clear(); }
  const sy = window.scrollY, app = $("#app");
  app.innerHTML = route.v === "read" ? readView() : route.v === "book" ? bookView() : route.v === "progress" ? progressView() : dayView();
  if (route.v === "read") {
    const t = route.scrollV != null ? route.scrollV : markV(route.g);
    const el = t != null ? $("#v" + t) : null;
    if (route.keep) window.scrollTo(0, sy); else if (el) { el.scrollIntoView({ block: "center" }); pulseVerse(t, el); } else window.scrollTo(0, 0);
    route.keep = false; route.scrollV = null;
  } else if (route.keep) { window.scrollTo(0, sy); route.keep = false; } else window.scrollTo(0, 0);
}

/* ---------- חלונות קופצים ---------- */
let prevFocus = null;
function closeSheet() {
  const ov = $("#ov"), was = ov.classList.contains("show");
  ov.classList.remove("show"); document.body.style.overflow = ""; $("#app").removeAttribute("aria-hidden"); $("#app").removeAttribute("inert");
  if (was) { if (prevFocus && document.contains(prevFocus)) prevFocus.focus(); else { const gb = $("[data-set]"); if (gb) gb.focus(); } }
  prevFocus = null;
}
function openSheet(html) {
  const ov = $("#ov"); if (!ov.classList.contains("show")) prevFocus = document.activeElement;
  $("#sheet").innerHTML = html; ov.classList.add("show"); document.body.style.overflow = "hidden"; $("#app").setAttribute("aria-hidden", "true"); $("#app").setAttribute("inert", "");
  ($("#sheet .x") || $("#sheet")).focus();
}
function openPop(ids) {
  const cs = ids.split(",").map(x => POP[+x]).filter(Boolean);
  openSheet(`<button class="x" data-close aria-label="סגור">✕</button>` + cs.map(c => `<div class="cmt ${c.src}"><span class="src">${c.src === "d" ? "מצודת דוד" : "מצודת ציון"}</span>${c.h ? `<h4>${c.h}</h4>` : ""}<div>${c.b}</div></div>`).join(""));
}
function settingsHTML() {
  const th = [["auto", "אוטומטי", "linear-gradient(90deg,#f4efe4 50%,#12161c 50%)"], ["light", "יום", "#f4efe4"], ["sepia", "קלף", "#efe2c3"], ["dark", "לילה", "#12161c"]];
  const sw = (k, on) => `<button class="sw ${on ? "on" : ""}" data-sw="${k}" role="switch" aria-checked="${on}"></button>`;
  return `<button class="x" data-close aria-label="סגור">✕</button><h3 class="sh" style="margin-top:4px">הגדרות תצוגה</h3>
  <div class="row"><span>גודל הכתב</span><div class="seg"><button data-fs="-2">א−</button><button class="on" disabled>${S.fs}</button><button data-fs="2">א+</button></div></div>
  <div class="row"><span>טעמי המקרא</span>${sw("taamim", S.taamim)}</div>
  <div class="row"><span>היום מתחלף בשקיעה <small style="color:var(--mute)">(כמו התאריך העברי)</small></span>${sw("sunset", S.sunset)}</div>
  <div class="row"><span>פירוש מצודת דוד <i style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--hld);vertical-align:middle"></i></span>${sw("cd", S.cd)}</div>
  <div class="row"><span>פירוש מצודת ציון <i style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--hlz);vertical-align:middle"></i></span>${sw("cz", S.cz)}</div>
  <div style="margin-top:12px;font-weight:700">מצב תצוגה</div>
  <div style="font-size:13px;color:var(--mute)">"אוטומטי" עוקב אחרי ההגדרה של המכשיר (בהיר או כהה)</div>
  <div class="themes" style="margin-top:8px">${th.map(([k, n, c]) => `<button class="${S.theme === k ? "on" : ""}" data-th="${k}"><i style="background:${c}"></i>${n}</button>`).join("")}</div>`;
}

/* ---------- אירועים ---------- */
document.addEventListener("click", e => {
  if (e.target.id === "ov") return closeSheet();
  const t = e.target.closest("[data-go],[data-read],[data-toggle],[data-day],[data-week],[data-sunset],[data-today],[data-jump],[data-book],[data-bm],[data-fs],[data-set],[data-sw],[data-th],[data-p],[data-close],[data-next],[data-prev],[data-home],[data-hint],[data-undo],[data-share],[data-installhelp],[data-bmclear],[data-retry],[data-join],[data-markall],[data-bk],[data-navback],[data-navfwd],[data-refresh],[data-bookall],[data-selmode],[data-pick],[data-selact]");
  if (!t) return;
  const D = t.dataset;
  if (t.hasAttribute("data-close")) closeSheet();
  else if (D.p) openPop(D.p);
  else if (t.hasAttribute("data-set")) openSheet(settingsHTML());
  else if (D.sw) { S[D.sw] = !S[D.sw]; save(); if (D.sw === "sunset") checkDayRoll(); t.classList.toggle("on", S[D.sw]); t.setAttribute("aria-checked", S[D.sw]); route.keep = true; render(); }
  else if (D.th) { S.theme = D.th; applyTheme(); save(); document.querySelectorAll("#sheet [data-th]").forEach(b => b.classList.toggle("on", b.dataset.th === S.theme)); }
  else if (D.fs && t.closest("#sheet")) { S.fs = Math.min(48, Math.max(16, S.fs + +D.fs)); save(); const tx = $(".text"); if (tx) tx.style.setProperty("--fs", S.fs + "px"); const lb = t.parentElement.querySelector(".on"); if (lb) lb.textContent = S.fs; }
  else if (t.hasAttribute("data-refresh")) hardRefresh();
  else if (t.hasAttribute("data-navback")) { if (navIdx > 0) history.back(); }
  else if (t.hasAttribute("data-navfwd")) { if (navIdx < navMax) history.forward(); }
  else if (D.bookall != null) {
    const b = +D.bookall, on = D.v === "1", n = B[b].c.length;
    if (confirm(on ? `לסמן את כל ${B[b].n} (${n} פרקים) כנלמדו?` : `לבטל את הסימון של כל ${B[b].n}?`)) {
      for (let c = 0; c < n; c++) { const key = ck(firstG[b] + c); if (on) S.done[key] = 1; else delete S.done[key]; }
      save(); toast(on ? `${B[b].n} סומן כנלמד ✓` : `הסימון של ${B[b].n} בוטל`); route.keep = true; render();
    }
  }
  else if (t.hasAttribute("data-selmode")) { selMode = !selMode; SEL.clear(); route.keep = true; render(); }
  else if (D.pick != null) { const c = +D.pick; if (SEL.has(c)) SEL.delete(c); else SEL.add(c); route.keep = true; render(); }
  else if (D.selact) {
    const b = route.b, n = B[b].c.length, act = D.selact;
    const setc = (c, on) => { const key = ck(firstG[b] + c); if (on) S.done[key] = 1; else delete S.done[key]; };
    if (act === "all") for (let c = 0; c < n; c++) SEL.add(c);
    else if (act === "clear") SEL.clear();
    else if (SEL.size === 0) { toast("לא נבחרו פרקים"); return; }
    else if (act === "mark") { SEL.forEach(c => setc(c, true)); toast(`${SEL.size} פרקים סומנו כנלמדו ✓`); SEL.clear(); save(); }
    else if (act === "unmark") { SEL.forEach(c => setc(c, false)); toast(`הסימון של ${SEL.size} פרקים בוטל`); SEL.clear(); save(); }
    else if (act === "upto") { const m = Math.max(...SEL); for (let c = 0; c <= m; c++) setc(c, true); toast(`סומנו פרקים 1 עד ${m + 1} ✓`); SEL.clear(); save(); }
    route.keep = true; render();
  }
  else if (t.hasAttribute("data-home")) go({ v: "day", date: lastDay || iso(today()) });
  else if (t.hasAttribute("data-share")) shareApp(t.getAttribute("data-share"));
  else if (t.hasAttribute("data-installhelp")) openSheet(installHelpHTML());
  else if (t.hasAttribute("data-hint")) { S.hintBm = true; save(); route.keep = true; render(); }
  else if (t.hasAttribute("data-bmclear")) { S.bm = null; save(); toast("הסימניה הוסרה"); route.keep = true; render(); }
  else if (t.hasAttribute("data-retry")) { delete txFail[CH[route.g].b]; render(); }
  else if (t.hasAttribute("data-join")) { S.from = Math.max(0, dayIdx(today())) * PER_DAY; save(); toast("מעכשיו נספרים רק פרקים מהיום והלאה"); route.keep = true; render(); }
  else if (t.hasAttribute("data-markall")) { if (confirm("לסמן את כל הפרקים עד היום כנלמדו?")) { const lim = Math.min(Math.max(0, dayIdx(today())), DAYS) * PER_DAY; for (let g = 0; g < Math.min(lim, TOTAL); g++) S.done[ck(g)] = 1; save(); route.keep = true; render(); } }
  else if (D.bk) backup(D.bk);
  else if (D.go) go(D.go === "day" ? { v: "day", date: iso(today()) } : { v: "progress" });
  else if (t.hasAttribute("data-undo")) { if (lastBm) { S.bm = lastBm; lastBm = null; save(); $("#toast").classList.remove("show"); if (route.v === "read") route.resume = null; route.keep = true; render(); } }
  else if (D.read != null) {
    const r = { v: "read", g: +D.read, scrollV: D.v != null ? +D.v : null };
    if (t.hasAttribute("data-resume") && S.bm) {                       // ממשיכים ללמוד - הסימניה הישנה כבר לא נחוצה
      lastBm = S.bm; r.resume = S.bm; S.bm = null; save(); toast("הסימניה הוסרה - מתקדמים הלאה", "ביטול");
    }
    go(r);
  }
  else if (D.toggle != null) {
    const g = +D.toggle; if (isDone(g)) delete S.done[ck(g)]; else { S.done[ck(g)] = 1; toast("סומן כנלמד ✓"); }
    save(); route.keep = true; render();
  }
  else if (D.sunset != null) { S.sunset = D.sunset === "1"; save(); checkDayRoll(); toast(S.sunset ? "היום מתחלף בשקיעה" : "היום מתחלף בחצות"); route.keep = true; render(); }
  else if (D.day) go({ v: "day", date: D.day });
  else if (D.week) { const i = Math.min(DAYS - 1, Math.max(0, dayIdx(parseISO(route.date)) + 7 * +D.week)); go({ v: "day", date: iso(dateOfIdx(i)) }); }
  else if (t.hasAttribute("data-today")) go({ v: "day", date: iso(today()) });
  else if (D.jump) go({ v: "day", date: iso(dateOfIdx(+D.jump)) });
  else if (D.book) go({ v: "book", b: +D.book });
  else if (D.bm != null) { const v = +D.bm; if (bmAt(route.g, v)) { S.bm = null; toast("הסימניה הוסרה"); } else { S.bm = { k: ck(route.g), v }; route.resume = null; toast(`🔖 סומן: עד כאן למדתי, לפני פסוק ${gem(v + 1)}`); S.hintBm = true; } save(); route.keep = true; render(); }
  else if (t.hasAttribute("data-next") || t.hasAttribute("data-prev")) {
    const g = route.g + (t.hasAttribute("data-next") ? 1 : -1); if (g < 0 || g >= TOTAL) return;
    go({ v: "read", g }, true);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("role") === "button") { e.preventDefault(); e.target.click(); }
});
/* ---------- גיבוי ושחזור ---------- */
const bkData = () => ({ app: "tanach-yomi", v: 2, done: S.done, bm: S.bm, from: S.from });
const toCode = o => { const b = new TextEncoder().encode(JSON.stringify(o)); let s = ""; for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return btoa(s); };
const fromCode = c => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c), ch => ch.charCodeAt(0))));
function applyBackup(o) {
  if (!o || o.app !== "tanach-yomi" || !o.done) throw 0;
  if (typeof o.done !== "object") throw 0;
  for (const k of Object.keys(o.done)) if (k in KG) S.done[k] = 1;
  if (o.bm && typeof o.bm.k === "string" && o.bm.k in KG && Number.isInteger(o.bm.v) && o.bm.v >= 0 && o.bm.v < vcount(KG[o.bm.k])) S.bm = { k: o.bm.k, v: o.bm.v };
  if (Number.isInteger(o.from) && o.from >= 0) S.from = Math.min(S.from || 0, o.from);
  save(); toast("הגיבוי שוחזר ✓"); route.keep = true; render();
}
function backup(kind) {
  if (kind === "copy") {
    const c = toCode(bkData());
    (navigator.clipboard ? navigator.clipboard.writeText(c).then(() => toast("הקוד הועתק - שמור אותו במקום בטוח")) : Promise.reject()).catch(() => prompt("העתק את הקוד ושמור אותו:", c));
  } else if (kind === "file") {
    const json = JSON.stringify(bkData()), name = "tanach-yomi-backup-" + iso(today()) + ".json";
    const f = typeof File === "function" ? new File([json], name, { type: "application/json" }) : null;
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(() => {}); return; }
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } else if (kind === "restore") {
    const c = prompt("הדבק כאן את קוד הגיבוי:"); if (!c) return;
    try { applyBackup(fromCode(c.trim())); } catch (e) { toast("הקוד לא תקין"); }
  } else if (kind === "load") $("#bkf").click();
}
document.addEventListener("change", e => {
  if (e.target.id === "bkf" && e.target.files[0]) { const r = new FileReader(); r.onload = () => { try { applyBackup(JSON.parse(r.result)); } catch (x) { toast("הקובץ לא תקין"); } }; r.readAsText(e.target.files[0]); e.target.value = ""; return; }
  const k = e.target.dataset.nav; if (!k) return; const v = e.target.value;
  if (k === "book") { navBook = v; route.keep = true; render(); return; }
  if (k === "chap") { if (v !== "") go({ v: "read", g: firstG[+navBook] + +v }); return; }
  const d = parseISO(route.date), cur = DL.find(x => x.iso === iso(d)) || DL[Math.max(0, Math.min(DAYS - 1, dayIdx(d)))];
  const H = k[0] === "h";
  let y = H ? cur.hy : cur.gy, m = H ? cur.hm : cur.gm, dd = H ? cur.hdn : cur.gd;
  if (k[1] === "y") y = v; else if (k[1] === "m") m = v; else dd = v;
  let pool = DL.filter(x => H ? x.hy === String(y) : x.gy === +y);
  if (k[1] === "y" || !pool.some(x => String(H ? x.hm : x.gm) === String(m))) m = H ? pool[0].hm : pool[0].gm;
  pool = pool.filter(x => String(H ? x.hm : x.gm) === String(m));
  let hit = pool.find(x => String(H ? x.hdn : x.gd) === String(dd));
  if (!hit) hit = pool.reduce((a, x) => Math.abs((H ? +x.hdn : x.gd) - dd) < Math.abs((H ? +a.hdn : a.gd) - dd) ? x : a, pool[0]);
  go({ v: "day", date: hit.iso });
});
let shownToday = iso(today());
function checkDayRoll() {                                            // עבר יום (או שקיעה) בזמן שהאפליקציה פתוחה
  const t = iso(today()); if (t === shownToday) return;
  const wasToday = route.v === "day" && route.date === shownToday; shownToday = t;
  if (wasToday) go({ v: "day", date: t }, true); else if (route.v === "day") { route.keep = true; render(); }
}
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 3 * 3600e3 && route.v === "day" && route.date !== iso(today())) go({ v: "day", date: iso(today()) }, true);   // חזרה אחרי זמן רב - מתחילים מהיום
  checkDayRoll();
});
window.addEventListener("pageshow", checkDayRoll); window.addEventListener("focus", checkDayRoll);
setInterval(checkDayRoll, 30000);
fromHash();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(err => console.error("SW registration failed:", err));
</script>
